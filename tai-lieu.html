    <!-- ===== Ô 2 (DƯỚI): TÀI LIỆU ===== -->
    <section class="doc-panel doc-panel-2">
      <div class="wrap">
        <div class="panel-box">
          <div class="panel-head">
            <h2><svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V4.5M9 7h7"/></svg>Tài liệu</h2>

          </div>

          <!-- Khung xem PDF: ẩn cho đến khi bấm nút Xem -->
          <div id="viewer" class="viewer" hidden>
            <div class="viewer-bar">
              <h2 id="viewer-title"></h2>
              <div>
                <a id="viewer-open" class="btn btn-line" target="_blank" rel="noopener" href="#">Mở tab mới</a>
                <button id="viewer-close" class="btn btn-small" type="button">Đóng</button>
              </div>
            </div>
            <div class="drive-box">
              <iframe id="viewer-frame" title="Xem tài liệu"></iframe>
              <div id="viewer-pdf" class="pdf-pages" hidden></div>
              <span class="drive-mask" id="viewer-mask" hidden></span>
            </div>
          </div>

          <div class="list" id="doc-list"><p class="doc-note">Đang tải tài liệu...</p></div>
        </div>
      </div>
    </section>

  <footer class="site-footer">

  <script src="js/menu.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1"></script>
  <script src="js/supabase.js"></script>
  <script src="js/documents.js"></script>
  <script>

    // ===== TÀI LIỆU: lấy từ Supabase (bảng announcements, bài nào có đính kèm tệp) =====
    // Gồm: bài loại "Tài liệu" + thông báo có đính kèm tệp.
    var viewer = document.getElementById('viewer');
    var frame = document.getElementById('viewer-frame');
    var title = document.getElementById('viewer-title');
    var openLink = document.getElementById('viewer-open');
    var listBox = document.getElementById('doc-list');
    var mask = document.getElementById('viewer-mask');
    var pdfBox = document.getElementById('viewer-pdf');
    var pdfTok = null;
    var blobUrl = null;

    function note(text) {
      var p = document.createElement('p');
      p.className = 'doc-note';
      p.textContent = text;
      listBox.replaceChildren(p);
    }

    function closeViewer() {
      if (pdfTok) { pdfTok.cancel(); pdfTok = null; }
      pdfBox.replaceChildren();
      pdfBox.hidden = true;
      frame.hidden = false;
      frame.src = '';
      viewer.hidden = true;
      mask.hidden = true;
      if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    }

    async function viewDoc(d, btn) {
      var old = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Đang mở...';
      try {
        var u;
        if (pdfTok) { pdfTok.cancel(); pdfTok = null; }
        pdfBox.hidden = true;
        frame.hidden = false;
        if (!d.drive_url && docExt(d.file_name) === 'pdf' && docIsMobile()) {
          // Điện thoại: vẽ từng trang PDF để kéo xuống xem được tất cả các trang
          u = await docSignedUrl(d.file_path);
          if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
          mask.hidden = true;
          frame.src = '';
          frame.hidden = true;
          pdfBox.hidden = false;
          pdfTok = docRenderPdf(pdfBox, d.file_path);
        } else if (d.drive_url) {
          var info = docDriveInfo(d.drive_url);
          if (!info) throw new Error('Link Drive không hợp lệ');
          u = info.preview;
          if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
          mask.hidden = false;
        } else {
          u = await docBlobUrl(d.file_path, d.file_name);
          if (blobUrl) URL.revokeObjectURL(blobUrl);
          blobUrl = u;
          mask.hidden = true;
        }
        if (!pdfTok) frame.src = u;
        openLink.href = u;
        title.textContent = d.title;
        viewer.hidden = false;
        viewer.scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        console.error(e);
        alert('Chưa mở được tài liệu. Hãy thử lại hoặc bấm Tải về');
      }
      btn.disabled = false;
      btn.textContent = old;
    }

    function renderDocs(items) {
      if (!items.length) return note('Chưa có tài liệu nào');
      var frag = document.createDocumentFragment();
      items.forEach(function (d) {
        var row = document.createElement('div');
        row.className = 'row';
        var info = document.createElement('div');
        var h = document.createElement('h3');
        h.textContent = d.title;
        var meta = document.createElement('span');
        meta.textContent = docItemLabel(d) + (d.file_size ? ' · ' + docSize(d.file_size) : '') +
          ' · ' + new Date(d.created_at).toLocaleDateString('vi-VN') +
          (d.kind === 'document' ? '' : ' · Đính kèm thông báo');
        info.append(h, meta);
        if (d.kind === 'document' && d.body) {
          var desc = document.createElement('p');
          desc.className = 'doc-desc';
          desc.textContent = d.body;
          info.appendChild(desc);
        }
        var acts = document.createElement('div');
        acts.className = 'doc-btns';
        if (docItemCanPreview(d)) {
          var v = document.createElement('button');
          v.type = 'button'; v.className = 'btn btn-line'; v.textContent = 'Xem';
          v.addEventListener('click', function () { viewDoc(d, v); });
          acts.appendChild(v);
        }
        var dl = document.createElement('button');
        dl.type = 'button'; dl.className = 'btn btn-small'; dl.textContent = 'Tải về';
        dl.addEventListener('click', function () { docItemDownload(d); });
        acts.appendChild(dl);
        row.append(info, acts);
        frag.appendChild(row);
      });
      listBox.replaceChildren(frag);
    }

    document.getElementById('viewer-close').addEventListener('click', closeViewer);

    (async function () {
      var r = await sb.from('announcements').select('*')
        .is('target_student_id', null)
        .order('created_at', { ascending: false });
      if (r.error) {
        console.error('Không tải được tài liệu:', r.error.message);
        return note('Không tải được tài liệu. Hãy tải lại trang');
      }
      renderDocs(r.data.filter(docHasFile));
    })();
  </script>
