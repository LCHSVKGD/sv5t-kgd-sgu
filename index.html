<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ngọn lửa Tiên phong khoa Giáo dục</title>
  <link rel="icon" type="image/png" href="images/logokhoa.png">  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="landing-page">

  <main class="landing" id="landing">
    <h1 class="sr-only">Ngọn lửa Tiên phong khoa Giáo dục</h1>

    <div class="intro">
      <button class="logo-btn" id="logo-btn" type="button" aria-expanded="false" aria-controls="landing-actions" aria-label="Bấm để đăng nhập hoặc đăng ký">
        <!-- LOGO TẠM: khi có logo thật, xóa khối <svg> này và thay bằng:
             <img src="images/logo-ngon-lua.png" alt="Logo Ngọn lửa Tiên phong"> -->
        <svg viewBox="0 0 100 120" role="img" aria-label="Logo tạm" xmlns="http://www.w3.org/2000/svg">
          <path fill="#f08a24" d="M50 4c4 18 24 30 24 56 0 8-3 15-7 20 1-9-3-16-9-22 1 11-5 16-8 22-3-6-12-10-12-22-6 7-9 15-8 23-6-5-10-13-10-22C20 36 44 28 50 4z"/>
          <path fill="#f08a24" d="M28 96h44c0 12-10 20-22 20S28 108 28 96z"/>
        </svg>
      </button>

      <p class="tagline">Ngọn lửa Tiên phong<br>khoa Giáo dục</p>

      <div class="landing-actions" id="landing-actions">
        <a class="btn btn-line" href="dang-nhap.html">Đăng nhập</a>
        <a class="btn btn-primary" href="dang-ky.html">Đăng ký</a>
      </div>
    </div>
  </main>

  <script>
    var landing = document.getElementById('landing');
    var logoBtn = document.getElementById('logo-btn');

// Hiện nút Đăng nhập / Đăng ký
function moNut() {
  landing.classList.add('open');
  logoBtn.setAttribute('aria-expanded', 'true');
}

// Tự hiện sau 2 giây (2000 = 2 giây, muốn nhanh hay chậm hơn thì đổi số này)
setTimeout(moNut, 2000);

// Bấm vào logo trước 2 giây thì hiện ngay
logoBtn.addEventListener('click', moNut);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1"></script>
  <script src="js/supabase.js"></script>
  <script>
    // Đã đăng nhập thì vào thẳng trang tổng quan
    sb.auth.getSession().then(function (r) { if (r.data.session) location.replace('tong-quan.html'); });
  </script>
</body>
</html>
