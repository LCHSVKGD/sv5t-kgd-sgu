<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ngọn lửa Tiên phong khoa Giáo dục</title>
  <link rel="icon" type="image/png" href="images/logokhoa.png">  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="landing-page">

  <main class="landing" id="landing">
    <h1 class="sr-only">Ngọn lửa Tiên phong khoa Giáo dục</h1>

    <div class="intro">
      <button class="logo-btn" id="logo-btn" type="button" aria-label="Bấm để vào trang tổng quan">
        <img src="images/logoclb.png" alt="Logo CLB Ngọn lửa Tiên phong">
      </button>

      <p class="tagline">Ngọn lửa Tiên phong<br>khoa Giáo dục</p>
</div>
  </main>

  <script>
    // Hiện trang chào 3 giây rồi tự vào Tổng quan (3000 = 3 giây, muốn nhanh hay chậm hơn thì đổi số này).
    // Dùng replace để nút Quay lại của trình duyệt không bị kẹt ở trang chào.
    function vaoTongQuan() { location.replace('tong-quan.html'); }
    setTimeout(vaoTongQuan, 3000);
    // Bấm vào logo thì vào ngay
    document.getElementById('logo-btn').addEventListener('click', vaoTongQuan);
  </script>
</body>
</html>
