    <section class="tb-section">
      <div class="wrap">
        <div class="tb-layout">

          <!-- Bên trái: 1 ô duy nhất chứa tất cả thông báo -->
          <div class="tb-side">
            <section class="tb-box" aria-labelledby="h-tb">
              <h2 id="h-tb">THÔNG BÁO MỚI</h2>
              <ul class="tb-list" id="list-tb"></ul>
            </section>
          </div>

          <!-- Bên phải: nội dung thông báo -->
          <section class="tb-box tb-right" aria-labelledby="h-nd">
            <h2 id="h-nd">NỘI DUNG</h2>
            <article class="tb-detail is-empty" id="detail" aria-live="polite">
              <p class="tb-empty">TRỐNG</p>
            </article>
          </section>

        </div>
      </div>
    </section>

    <div class="wrap">Liên Chi hội Sinh viên khoa Giáo dục, Trường Đại học Sài Gòn</div>
  </footer>

  <script src="js/menu.js"></script>
  <script src="js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1"></script>
  <script src="js/supabase.js"></script>
  <script src="js/documents.js"></script>
  <script>
    // Đăng xuất
    document.getElementById('logout').addEventListener('click', async function (e) {
      e.preventDefault();
      await sb.auth.signOut();
      location.href = 'index.html';
    });

    // ===== DỮ LIỆU THÔNG BÁO: lấy từ Supabase (bảng announcements) =====
    var ITEMS = [];
    var uid = null;
    var readIds = {};                 // thông báo đã đọc, nhớ trên thiết bị này
    var READ_KEY = 'sv5t-da-doc-';

    function fmtDate(t) { return new Date(t).toLocaleDateString('vi-VN'); }

    // ===== HIỂN THỊ =====
    var detail = document.getElementById('detail');

    function showEmpty() {
      detail.className = 'tb-detail is-empty';
      detail.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'tb-empty';
      p.textContent = 'TRỐNG';
      detail.appendChild(p);
    }

        function attachBox(item) {
      var box = document.createElement('div');
      box.className = 'tb-attach';
      var cap = document.createElement('p');
      cap.className = 'tb-attach-cap';
      cap.textContent = 'Tài liệu đính kèm';
      var name = document.createElement('strong');
      name.textContent = item.file_name;
      var info = document.createElement('span');
      info.textContent = docLabel(item.file_name) + (item.file_size ? ' · ' + docSize(item.file_size) : '');
      var acts = document.createElement('div');
      acts.className = 'tb-attach-btns';
      if (docCanPreview(item.file_name)) {
        var v = document.createElement('button');
        v.type = 'button'; v.className = 'btn btn-line'; v.textContent = 'Xem';
        v.addEventListener('click', function () { docOpenTab(item.file_path, item.file_name); });
        acts.appendChild(v);
      }
      var d = document.createElement('button');
      d.type = 'button'; d.className = 'btn btn-small'; d.textContent = 'Tải về';
      d.addEventListener('click', function () { docDownload(item.file_path, item.file_name); });
      acts.appendChild(d);
      var more = document.createElement('a');
      more.href = 'tai-lieu.html'; more.textContent = 'Xem ở trang Tài liệu & hướng dẫn';
      box.append(cap, name, info, acts, more);
      return box;
    }

    function openItem(item, btn) {
      document.querySelectorAll('.tb-item').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      btn.classList.remove('unread');
      item.unread = false;
      readIds[item.id] = true;
      try { localStorage.setItem(READ_KEY + uid, JSON.stringify(readIds)); } catch (e) {}

      detail.className = 'tb-detail';
      detail.innerHTML = '';
      var h = document.createElement('h2');
      h.textContent = item.title;
      var meta = document.createElement('p');
      meta.className = 'tb-meta';
      meta.textContent = item.date;
      var body = document.createElement('div');
      body.className = 'tb-body';
      body.textContent = item.body;
      detail.appendChild(h);
      detail.appendChild(meta);
      detail.appendChild(body);
      if (item.file_path) detail.appendChild(attachBox(item));

      // Trên điện thoại, 2 khung xếp chồng nên tự cuộn xuống phần nội dung
      if (window.matchMedia('(max-width: 900px)').matches) {
        detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function render() {
      var ul = document.getElementById('list-tb');
      var items = ITEMS;
      ul.innerHTML = '';
      if (!items.length) {
        var none = document.createElement('li');
        none.className = 'tb-none';
        none.textContent = 'Chưa có thông báo';
        ul.appendChild(none);
        return;
      }
      items.forEach(function (item) {
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tb-item' + (item.unread ? ' unread' : '');
        var t = document.createElement('strong');
        t.textContent = item.title;
        var d = document.createElement('span');
        d.textContent = item.date;
        btn.appendChild(t);
        btn.appendChild(d);
        btn.addEventListener('click', function () { openItem(item, btn); });
        li.appendChild(btn);
        ul.appendChild(li);
      });
    }

    (async function () {
      var ul = document.getElementById('list-tb');
      var s = await sb.auth.getSession();
      if (!s.data.session) return;
      uid = s.data.session.user.id;
      try { readIds = JSON.parse(localStorage.getItem(READ_KEY + uid) || '{}'); } catch (e) { readIds = {}; }

      // Thông báo chung (không chỉ định người nhận) + thông báo riêng gửi cho chính bạn
      var r = await sb.from('announcements').select('*')
        .neq('kind', 'document')
        .or('target_student_id.is.null,target_student_id.eq.' + uid)
        .order('created_at', { ascending: false });
      if (r.error) {
        console.error('Không tải được thông báo:', r.error.message);
        var li = document.createElement('li');
        li.className = 'tb-none';
        li.textContent = 'Không tải được thông báo. Hãy tải lại trang.';
        ul.replaceChildren(li);
        return;
      }
      ITEMS = r.data.map(function (a) {
        return {
          id: a.id,
          title: a.title,
          body: a.body,
          date: fmtDate(a.created_at) + (a.target_student_id ? ' · Dành riêng cho bạn' : ''),
          file_path: a.file_path,
          file_name: a.file_name,
          file_size: a.file_size,
          unread: !readIds[a.id]
        };
      });
      render();
    })();
  </script>
  <script src="js/auth-guard.js"></script>
